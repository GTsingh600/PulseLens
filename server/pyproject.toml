[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "pulselens"
version = "0.1.0"
description = "Capture-aware liveness layer for video-KYC (prototype)"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "pydantic>=2.7",
    "python-multipart>=0.0.9",
    "python-dotenv>=1.0",
    "pyyaml>=6.0",
    "numpy>=1.26",
    "pillow>=10.0",
]

[project.optional-dependencies]
dev = ["pytest>=8.0", "httpx>=0.27", "ruff>=0.6"]
# Track B, M1.4 onward. Installed by `make setup`.
# mediapipe brings opencv-contrib-python (cv2); do not add a second OpenCV package.
vision = ["mediapipe>=0.10.14", "scipy>=1.11", "matplotlib>=3.8"]
# Heavy models (ArcFace, CLIP probe). Opt-in with `make setup-ml`; insightface may need a C++ toolchain on Windows.
ml = ["insightface>=0.7.3", "onnxruntime>=1.18", "open_clip_torch>=2.24", "torch>=2.2", "scikit-learn>=1.4", "joblib>=1.3"]

[tool.setuptools.packages.find]
include = ["pulselens*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
addopts = "-q"
